<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>神木之芽 路線運算</title>
    <meta name="description" content="支援最多 15 條橫線的六線迷宮鬼腳圖路線與機率即時運算工具。" />
    <meta property="og:title" content="神木之芽 路線運算" />
    <meta property="og:description" content="支援最多 15 條橫線的六線迷宮鬼腳圖路線與機率即時運算工具。" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>神木之芽 路線運算</h1>
        <div class="header-row">
          <div class="header-left">
            <label for="rung-count-input" id="rung-label">橫線數量（5–15）</label>
            <div class="stepper">
              <button type="button" id="rung-minus" aria-label="減少橫線數量">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
              </button>
              <input id="rung-count-input" type="number" min="5" max="15" inputmode="numeric" value="5" />
              <button type="button" id="rung-plus" aria-label="增加橫線數量">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
              </button>
            </div>
            <div class="stats mono">
              <span id="stat-placed"></span><span aria-hidden="true">·</span><span id="stat-total"></span>
            </div>
          </div>
          <button type="button" id="reset-btn" class="btn-reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>
            重設
          </button>
        </div>
      </header>

      <div class="workspace">
        <section class="card" id="board-section" aria-label="迷宮路線盤面"></section>
        <section class="card matrix-card" id="matrix-section" aria-label="路線機率矩陣"></section>
      </div>

      <section class="card examples" aria-label="層數與盤面範例">
        <div class="examples-head">
          <h2>層數對應與盤面範例</h2>
          <p>橫線的數量對應當前層數：第一層為 <span class="mono accent">5</span> 條、第二層為 <span class="mono accent">6</span> 條，以此類推。</p>
        </div>
        <div class="examples-grid" id="examples-grid"></div>
      </section>
    </main>

    <div id="modal" class="modal" role="dialog" aria-modal="true" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
